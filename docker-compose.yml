services:
  mind-map:
    image: nginx:alpine
    container_name: mind-map
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mind-map.rule=Host(`apps.aloha.university`) && PathPrefix(`/mind-map`)"
      - "traefik.http.routers.mind-map.entrypoints=websecure"
      - "traefik.http.routers.mind-map.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mind-map.middlewares=mind-map-strip"
      - "traefik.http.middlewares.mind-map-strip.stripprefix.prefixes=/mind-map"
      - "traefik.http.services.mind-map.loadbalancer.server.port=80"

networks:
  web:
    external: true
